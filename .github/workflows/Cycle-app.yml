name: Run Price & Time Cycle Analysis

on:
  push:
    branches:
      - main
    paths:
      - 'stockdata_15/**'
      - 'stockdata_1H/**'
      - 'stockdata_D/**'
      - 'stockdata_W/**'
      - 'stockdata_M/**'
      - 'analyze_cycles.py'
  schedule:
    # Runs every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  analyze-cycles:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push generated JSON files back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Run Cycle Analysis Script
        run: |
          python analyze_cycles.py --root . --out ./cycles/data --horizon-days 21

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add cycles/data/
          
          # Check if there are changes before committing
          if git diff --staged --quiet; then
            echo "No changes detected in cycles/data directory."
          else
            git commit -m "chore(data): auto-update cycle analysis dashboard data [skip ci]"
            git push
          fi
