name: Generate MACD Dashboard_Manualrun Only

# Manual trigger only — no push/schedule/PR triggers.
# Run it from the "Actions" tab in GitHub -> select this workflow -> "Run workflow".
on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: "Commit message for the generated index.html"
        required: false
        default: "chore: regenerate dashboard"

permissions:
  contents: write   # needed so the workflow can commit index.html back to the repo

jobs:
  build-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Run dashboard generator
        run: python generate_dashboard.py

      - name: Upload index.html as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: index-html
          path: index.html
          if-no-files-found: error

      - name: Commit and push updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to index.html — nothing to commit."
          else
            git commit -m "${{ github.event.inputs.commit_message }}"
            git push
          fi
