name: MACD Dashboard Update

on:
  schedule:
    # Runs every hour from Monday to Friday (UTC time)
    - cron: "0 * * * 1-5"
  workflow_dispatch: # Allows manual trigger via GitHub web UI

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history to ensure smooth auto-commit & push handling
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      # Optional: Add your data fetcher script execution here if you have one
      # - name: Fetch Latest Stock Data
      #   run: python fetch_stock_data.py

      - name: Generate Dashboard HTML
        run: python generate_dashboard.py

      - name: Commit & Push Updated Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update stock data and dashboard"
          branch: main
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          author_name: "github-actions[bot]"
          author_email: "github-actions[bot]@users.noreply.github.com"
