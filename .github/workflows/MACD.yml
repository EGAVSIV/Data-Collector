name: Fetch TradingView Stock Data

on:
  # Manual Run Button
  workflow_dispatch:

  # Scheduled Runs (Monday to Friday)
  schedule:
    # 09:00 AM & 09:15 AM IST (03:30 & 03:45 UTC)
    - cron: "30,45 3 * * 1-5"

    # 09:30 AM to 03:00 PM IST every 15 mins (04:00 to 09:45 UTC)
    - cron: "*/15 4-9 * * 1-5"

    # 03:30 PM IST (10:00 UTC) & 04:00 PM IST (10:30 UTC)
    - cron: "0,30 10 * * 1-5"

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Data Fetch Script
        run: |
          python main.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || (git commit -m "Auto-update stock data [skip ci]" && git push)
