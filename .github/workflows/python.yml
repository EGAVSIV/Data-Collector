name: Fetch Data and Update MACD Dashboard

on:
  workflow_dispatch:

  schedule:
    # Monday-Friday

    # 09:07 AM IST
    - cron: "37 3 * * 1-5"

    # Every 30 minutes
    # 09:37 AM IST to 03:07 PM IST
    - cron: "7,37 4-9 * * 1-5"

    # 04:07 PM IST
    - cron: "37 10 * * 1-5"


permissions:
  contents: write


concurrency:
  group: stock-data-update
  cancel-in-progress: false


jobs:
  update-stock-dashboard:

    name: Download Data and Build Dashboard

    runs-on: ubuntu-latest

    # Give enough margin for all 5 timeframes
    timeout-minutes: 90


    steps:

      # ==========================================
      # STEP 1: Checkout Repository
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================
      # STEP 2: Setup Python
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # ==========================================
      # STEP 3: Install Dependencies
      # ==========================================

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ==========================================
      # STEP 4: Run Stock Data Downloader
      # ==========================================

      - name: Run Stock Data Downloader
        env:
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
        run: |
          python data_collector.py


      # ==========================================
      # STEP 5: Update ALL Data Folder Timestamps
      # ==========================================

      - name: Update Data Folder Timestamps
        run: |

          RUN_TIME=$(TZ='Asia/Kolkata' date +"%Y-%m-%d %H:%M:%S IST")

          echo "======================================"
          echo "Workflow completed: $RUN_TIME"
          echo "======================================"

          for folder in \
            stockdata_D \
            stockdata_W \
            stockdata_M \
            stockdata_15 \
            stockdata_1H
          do

            mkdir -p "$folder"

            echo "Last successful workflow run: $RUN_TIME" \
              > "$folder/_last_update.txt"

            echo "Updated: $folder/_last_update.txt"

          done


      # ==========================================
      # STEP 6: Generate Dashboard
      # ==========================================

      - name: Generate Dashboard HTML
        run: |
          python generate_dashboard.py


      # ==========================================
      # STEP 7: Remove Runtime Files
      # ==========================================

      - name: Clean Runtime Logs
        if: always()
        run: |
          rm -f download_log.txt
          rm -f error_symbols.txt


      # ==========================================
      # STEP 8: Show ALL Changed Files
      # ==========================================

      - name: Show Changed Files
        run: |
          echo "======================================"
          echo "FILES CHANGED BY THIS WORKFLOW"
          echo "======================================"

          git status --short

          echo "======================================"


      # ==========================================
      # STEP 9: Configure Git
      # ==========================================

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"


      # ==========================================
      # STEP 10: Stage ALL Changes
      # ==========================================

      - name: Stage All Updated Files
        run: |

          git add -A

          echo "======================================"
          echo "STAGED FILES"
          echo "======================================"

          git diff --cached --name-status

          echo "======================================"


      # ==========================================
      # STEP 11: Commit and Push
      # ==========================================

      - name: Commit and Push Changes
        run: |

          if git diff --cached --quiet
          then

            echo "No changes detected. Nothing to commit."

          else

            git commit \
              -m "Auto-update stock data and MACD dashboard [skip ci]"

            git push origin main

            echo "======================================"
            echo "SUCCESSFULLY PUSHED ALL CHANGES"
            echo "======================================"

          fi
