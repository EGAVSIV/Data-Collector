name: Fetch TradingView Stock Data

on:
  # Manual Run Trigger
  workflow_dispatch:

  # Scheduled Runs
  schedule:
    # 09:00 AM IST
    - cron: "30 3 * * 1-5"
    # Every 30 minutes from 09:30 AM until 03:30 PM IST
    - cron: "0,30 4-9 * * 1-5"
    # 03:30 PM IST
    - cron: "0 10 * * 1-5"
    # 04:00 PM IST
    - cron: "30 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: stock-data-update
  cancel-in-progress: false

jobs:
  fetch-stock-data:
    name: Download and Update Stock Data
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      # STEP 1: Fast Shallow Checkout (Only fetches the latest commit)
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # STEP 2: Setup Python with Dependency Caching
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # STEP 3: Install Dependencies Directly
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      # STEP 4: Run Data Downloader
      - name: Run Stock Data Downloader
        env:
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
        run: |
          python data_collector.py

      # STEP 5: Clean Up Logs
      - name: Remove Runtime Log Files
        if: always()
        run: |
          rm -f download_log.txt error_symbols.txt

      # STEP 6: Fast Automated Commit & Push (Only pushes if files changed)
      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update stock data"
          file_pattern: "stockdata_D/* stockdata_W/* stockdata_M/* stockdata_15/* stockdata_1H/*"
          skip_dirty_check: false
