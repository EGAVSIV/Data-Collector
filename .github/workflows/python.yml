name: Fetch TradingView Stock Data

on:

  # Manual Run Button
  workflow_dispatch:

  # Scheduled Runs
  schedule:

    # ==========================================
    # IST = UTC + 5:30
    #
    # 09:00 AM IST = 03:30 UTC
    # 09:30 AM IST = 04:00 UTC
    # 10:00 AM IST = 04:30 UTC
    # ...
    # 03:30 PM IST = 10:00 UTC
    # 04:00 PM IST = 10:30 UTC
    # ==========================================

    # 09:00 AM IST
    - cron: "30 3 * * 1-5"

    # Every 30 minutes from 09:30 AM
    # until 03:30 PM IST
    - cron: "0,30 4-9 * * 1-5"

    # 10:00 UTC = 03:30 PM IST
    - cron: "0 10 * * 1-5"

    # 04:00 PM IST
    - cron: "30 10 * * 1-5"


permissions:
  contents: write


concurrency:
  group: stock-data-update
  cancel-in-progress: false


jobs:

  fetch-stock-data:

    name: Download and Update Stock Data

    runs-on: ubuntu-latest

    timeout-minutes: 55


    steps:

      # ==========================================
      # STEP 1 - Checkout Repository
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================
      # STEP 2 - Setup Python 3.11
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # ==========================================
      # STEP 3 - Upgrade pip
      # ==========================================

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip


      # ==========================================
      # STEP 4 - Install Requirements
      # ==========================================

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt


      # ==========================================
      # STEP 5 - Run Stock Data Downloader
      # ==========================================

      - name: Run Stock Data Downloader
        env:
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
        run: |
          python data_collector.py

      # ==========================================
      # STEP 6 - Delete Log Files
      # Logs will NOT be committed to GitHub
      # ==========================================

      - name: Remove Runtime Log Files
        if: always()
        run: |
          rm -f download_log.txt
          rm -f error_symbols.txt


      # ==========================================
      # STEP 7 - Check for Data Changes
      # ==========================================

      - name: Check for Changes
        id: git-check
        run: |
          if [[ -n "$(git status --porcelain stockdata_D stockdata_W stockdata_M stockdata_15 stockdata_1H)" ]]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi


     # ==========================================
      # STEP 8 - Commit & Push to Current Repo
      # ==========================================
      - name: Commit and Push to Local Repo
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stockdata_D/ stockdata_W/ stockdata_M/ stockdata_15/ stockdata_1H/
          git commit -m "Auto update stock data $(date '+%Y-%m-%d %H:%M:%S UTC')"
          git push

      # ==========================================
      # STEP 9 - Push Updated Data to Multiple Repos
      # ==========================================
      - name: Push Data to Target Repositories
        if: steps.git-check.outputs.changes == 'true'
        env:
          PAT_TOKEN: ${{ secrets.DATA_PUSH_PAT }}
          GITHUB_OWNER: "EGAVSIV"
        run: |
          # Define array of target repositories
          TARGET_REPOS=(
            "stock-scan"
            "MULTIS"
            "Stock_Scanner_With_ASTA_Parameters"
            "GEOTRADER"
            "SECSEA"
          )

          # Configure global git identity once
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Save the root repository path
          ROOT_DIR=$(pwd)

          # Loop through each target repository
          for REPO in "${TARGET_REPOS[@]}"; do
            echo "=========================================="
            echo "Processing repository: ${REPO}"
            echo "=========================================="

            # Clean up target directory if it already exists from a prior iteration
            rm -rf target_repo

            # 1. Clone target repository
            git clone "https://x-access-token:${PAT_TOKEN}@github.com/${GITHUB_OWNER}/${REPO}.git" target_repo

            # 2. Copy folder data into target repo
            cp -r stockdata_D stockdata_W stockdata_M stockdata_15 stockdata_1H target_repo/

            # 3. Commit and push inside target_repo context
            cd target_repo
            git add stockdata_D/ stockdata_W/ stockdata_M/ stockdata_15/ stockdata_1H/

            if ! git diff --cached --quiet; then
              git commit -m "Sync stock data from Data-Collector $(date '+%Y-%m-%d %H:%M:%S UTC')"
              git push
              echo "Successfully pushed updates to ${REPO}."
            else
              echo "No changes detected for ${REPO}. Skipping push."
            fi

            # Return to root folder for next iteration
            cd "$ROOT_DIR"
          done
