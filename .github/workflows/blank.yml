name: Stock Data Collector Schedule

on:
  schedule:
    # Runs Monday-Friday every 30 minutes from 09:00 to 16:00 UTC
    # Note: Adjust UTC cron hours to match Indian Standard Time (IST is UTC+5:30)
    - cron: '30,0 3-10 * * 1-5'
  workflow_dispatch: # Allows MANUAL run button on GitHub UI

jobs:
  run-collector:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install tvdatafeed pandas

      - name: Run Data Collector
        run: python data_collector.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -m "Auto-update stock data [skip ci]" || exit 0
          git push
