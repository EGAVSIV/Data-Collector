<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MACD Master Multi-Timeframe Dashboard</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        h1 {
            color: var(--accent);
            margin: 0 0 10px 0;
            font-size: 26px;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            font-size: 14px;
            color: #94a3b8;
        }

        select {
            padding: 10px 14px;
            background: #0f172a;
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            cursor: pointer;
        }

        select:focus {
            border-color: var(--accent);
        }

        .stats-badge {
            display: inline-block;
            background: #0284c7;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        th, td {
            padding: 14px 18px;
            text-align: left;
        }

        th {
            background-color: #334155;
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        tr {
            border-bottom: 1px solid var(--border-color);
        }

        tr:hover {
            background-color: #26334d;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .bullish { background: #166534; color: #4ade80; }
        .bearish { background: #991b1b; color: #fca5a5; }
        .neutral { background: #854d0e; color: #fde047; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>MACD Multi-Timeframe Scanner Dashboard</h1>
        <p style="color: #94a3b8; margin: 0;">Automated transition & condition filter across 4 Timeframe Pairs</p>
    </header>

    <div class="controls">
        <div class="control-group">
            <label for="pairSelect">1. Select Timeframe Pair (LTF -> HTF)</label>
            <select id="pairSelect" onchange="filterData()">
                <option value="15m -> 1h">15m -> 1h</option>
                <option value="1h -> Daily">1h -> Daily</option>
                <option value="Daily -> Weekly">Daily -> Weekly</option>
                <option value="Weekly -> Monthly">Weekly -> Monthly</option>
            </select>
        </div>

        <div class="control-group">
            <label for="conditionSelect">2. Select MACD Transition Condition</label>
            <select id="conditionSelect" onchange="filterData()">
                <option value="Strong Bullish">Strong Bullish</option>
                <option value="Bullish Reversal">Bullish Reversal</option>
                <option value="Bullish Pullback">Bullish Pullback</option>
                <option value="Deep Pullback">Deep Pullback</option>
                <option value="Dip Buy / Reversal">Dip Buy / Reversal</option>
                <option value="Oversold Accumulation">Oversold Accumulation</option>
                <option value="Neutral / Consolidating">Neutral / Consolidating</option>
                <option value="Complex Reversal Failure">Complex Reversal Failure</option>
                <option value="Counter-Trend Buy">Counter-Trend Buy</option>
                <option value="Early Recovery Attempt">Early Recovery Attempt</option>
                <option value="Correction in Progress">Correction in Progress</option>
                <option value="Accelerating Correction">Accelerating Correction</option>
                <option value="Aggressive Counter-Trend">Aggressive Counter-Trend</option>
                <option value="Weak Oversold Bounce">Weak Oversold Bounce</option>
                <option value="Bearish Continuation">Bearish Continuation</option>
                <option value="Strong Bearish">Strong Bearish</option>
            </select>
        </div>
    </div>

    <div class="stats-badge" id="countBadge">Matching Stocks: 0</div>

    <table>
        <thead>
            <tr>
                <th>Symbol</th>
                <th>Timeframe Pair</th>
                <th>Condition / Interpretation</th>
                <th>Last Close Price</th>
            </tr>
        </thead>
        <tbody id="stockTableBody">
        </tbody>
    </table>
</div>

<script>
    const stockData = [{"symbol": "SHRIRAMFIN", "pair": "15m -> 1h", "condition": "Early Recovery Attempt", "close": 1123.5}, {"symbol": "COFORGE", "pair": "Daily -> Weekly", "condition": "Bullish Pullback", "close": 1881.6}, {"symbol": "SBICARD", "pair": "Daily -> Weekly", "condition": "Dip Buy / Reversal", "close": 665.15}, {"symbol": "CGPOWER", "pair": "1h -> Daily", "condition": "Complex Reversal Failure", "close": 868.75}, {"symbol": "ADANIGREEN", "pair": "1h -> Daily", "condition": "Neutral / Consolidating", "close": 1307.4}, {"symbol": "LTF", "pair": "Daily -> Weekly", "condition": "Strong Bullish", "close": 322.9}, {"symbol": "OIL", "pair": "Daily -> Weekly", "condition": "Bullish Pullback", "close": 471.3}, {"symbol": "MOTHERSON", "pair": "1h -> Daily", "condition": "Early Recovery Attempt", "close": 165.93}, {"symbol": "GVT&D", "pair": "Daily -> Weekly", "condition": "Early Recovery Attempt", "close": 4333.4}, {"symbol": "VEDL", "pair": "15m -> 1h", "condition": "Strong Bullish", "close": 286.4}, {"symbol": "RELIANCE", "pair": "1h -> Daily", "condition": "Accelerating Correction", "close": 1302.2}, {"symbol": "SHREECEM", "pair": "Weekly -> Monthly", "condition": "Strong Bearish", "close": 24860.0}, {"symbol": "GLENMARK", "pair": "Weekly -> Monthly", "condition": "Strong Bullish", "close": 2440.9}, {"symbol": "MANAPPURAM", "pair": "Daily -> Weekly", "condition": "Strong Bullish", "close": 368.05}, {"symbol": "HINDALCO", "pair": "1h -> Daily", "condition": "Strong Bullish", "close": 1056.5}, {"symbol": "TITAN", "pair": "15m -> 1h", "condition": "Strong Bullish", "close": 5112.3}, {"symbol": "ASIANPAINT", "pair": "Weekly -> Monthly", "condition": "Neutral / Consolidating", "close": 2633.1}, {"symbol": "HDFCAMC", "pair": "1h -> Daily", "condition": "Bullish Pullback", "close": 2673.4}, {"symbol": "SRF", "pair": "15m -> 1h", "condition": "Dip Buy / Reversal", "close": 2592.7}, {"symbol": "KEI", "pair": "15m -> 1h", "condition": "Oversold Accumulation", "close": 5528.8}, {"symbol": "PREMIERENE", "pair": "Daily -> Weekly", "condition": "Accelerating Correction", "close": 990.3}, {"symbol": "LUPIN", "pair": "15m -> 1h", "condition": "Neutral / Consolidating", "close": 2196.4}, {"symbol": "COCHINSHIP", "pair": "15m -> 1h", "condition": "Bullish Pullback", "close": 1547.0}, {"symbol": "DIXON", "pair": "1h -> Daily", "condition": "Bullish Pullback", "close": 14764.0}, {"symbol": "ICICIGI", "pair": "1h -> Daily", "condition": "Complex Reversal Failure", "close": 1591.2}, {"symbol": "NESTLEIND", "pair": "Weekly -> Monthly", "condition": "Bullish Pullback", "close": 1456.1}, {"symbol": "TCS", "pair": "15m -> 1h", "condition": "Weak Oversold Bounce", "close": 2270.1}, {"symbol": "PATANJALI", "pair": "15m -> 1h", "condition": "Strong Bearish", "close": 346.1}, {"symbol": "BDL", "pair": "15m -> 1h", "condition": "Bullish Pullback", "close": 1360.0}, {"symbol": "BOSCHLTD", "pair": "15m -> 1h", "condition": "Bullish Pullback", "close": 48875.0}, {"symbol": "YESBANK", "pair": "Daily -> Weekly", "condition": "Accelerating Correction", "close": 22.38}, {"symbol": "MARICO", "pair": "Weekly -> Monthly", "condition": "Bullish Pullback", "close": 831.95}, {"symbol": "HDFCBANK", "pair": "Weekly -> Monthly", "condition": "Strong Bearish", "close": 727.75}, {"symbol": "CANBK", "pair": "Weekly -> Monthly", "condition": "Early Recovery Attempt", "close": 129.51}, {"symbol": "APOLLOHOSP", "pair": "Weekly -> Monthly", "condition": "Bullish Pullback", "close": 8810.0}, {"symbol": "INOXWIND", "pair": "15m -> 1h", "condition": "Complex Reversal Failure", "close": 73.24}, {"symbol": "LICI", "pair": "15m -> 1h", "condition": "Strong Bearish", "close": 415.95}, {"symbol": "MCX", "pair": "Weekly -> Monthly", "condition": "Strong Bullish", "close": 3351.9}, {"symbol": "SWIGGY", "pair": "1h -> Daily", "condition": "Bullish Pullback", "close": 288.0}, {"symbol": "SWIGGY", "pair": "Daily -> Weekly", "condition": "Dip Buy / Reversal", "close": 288.0}, {"symbol": "JSWSTEEL", "pair": "Weekly -> Monthly", "condition": "Strong Bullish", "close": 1339.6}, {"symbol": "ETERNAL", "pair": "Daily -> Weekly", "condition": "Bullish Pullback", "close": 327.8}, {"symbol": "SUNPHARMA", "pair": "1h -> Daily", "condition": "Bearish Continuation", "close": 1910.2}, {"symbol": "KFINTECH", "pair": "1h -> Daily", "condition": "Strong Bullish", "close": 973.25}, {"symbol": "BSE", "pair": "15m -> 1h", "condition": "Strong Bullish", "close": 3342.1}];

    function getBadgeClass(cond) {
        if (cond.includes('Bullish') || cond.includes('Buy') || cond.includes('Recovery') || cond.includes('Accumulation')) {
            return 'bullish';
        } else if (cond.includes('Bearish') || cond.includes('Correction') || cond.includes('Failure')) {
            return 'bearish';
        }
        return 'neutral';
    }

    function filterData() {
        const selectedPair = document.getElementById('pairSelect').value;
        const selectedCondition = document.getElementById('conditionSelect').value;
        const tableBody = document.getElementById('stockTableBody');

        const filtered = stockData.filter(item => item.pair === selectedPair && item.condition === selectedCondition);

        document.getElementById('countBadge').innerText = `Matching Stocks: ${filtered.length}`;

        tableBody.innerHTML = '';

        if (filtered.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #94a3b8; padding: 30px;">No stocks matching this pair & condition.</td></tr>`;
            return;
        }

        filtered.forEach(row => {
            const badgeClass = getBadgeClass(row.condition);
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight: bold; color: var(--accent);">${row.symbol}</td>
                <td>${row.pair}</td>
                <td><span class="badge ${badgeClass}">${row.condition}</span></td>
                <td>${row.close !== undefined ? row.close.toFixed(2) : 'N/A'}</td>
            `;
            tableBody.appendChild(tr);
        });
    }

    // Initial load
    document.addEventListener('DOMContentLoaded', filterData);
</script>

</body>
</html>
